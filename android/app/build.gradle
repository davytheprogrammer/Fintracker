plugins {
    id "com.android.application"
    id "com.google.gms.google-services" // Firebase plugin
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}
 
android {
    namespace = "com.rax.finspense"
    // Use latest compileSdk for modern build features
    compileSdk 36

    ndkVersion = flutter.ndkVersion

    defaultConfig {
        applicationId "com.rax.finspense"
        // Set minSdk to 21 for maximum device compatibility (covers 99%+ devices)
        // while maintaining modern security and features
        minSdkVersion flutter.minSdkVersion
        // Use latest targetSdk for PlayStore compliance and modern features
        targetSdk 36
        // Bumped for new Play Store release
        versionCode 4
        versionName "1.0.3"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Ensure 64-bit ABIs are packaged so high-end devices have the native libraries they need.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        release {
            def keystoreProperties = new Properties()
            keystoreProperties.load(new FileInputStream(rootProject.file("key.properties")))

            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
    }

    buildTypes {
        release {
            // Temporarily disable code shrinking/minification to avoid R8-related
            // crashes on some device ABIs while we investigate root cause.
            // This makes the APK/AAB larger but is much safer for Play acceptance.
            minifyEnabled false
            shrinkResources false
            // Keep ProGuard file reference in case we re-enable shrinking later.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/*.kotlin_module'
            ]
        }
        // Preserve native libraries from plugins and avoid conflicts that can
        // cause crashes on certain ABIs. Pick-first is safe here because these
        // are identical native libs provided by different dependencies.
        jniLibs {
            pickFirsts += ['**/*.so']
        }
    }
}

// Force dependencies to avoid conflicts
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'androidx.core') {
            details.useVersion '1.12.0'
        }
        if (details.requested.group == 'androidx.appcompat') {
            details.useVersion '1.6.1'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    // Update Firebase BOM to latest stable
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'

    // Update Kotlin to latest stable
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    // Use stable multidex
    implementation 'androidx.multidex:multidex:2.0.1'
}
